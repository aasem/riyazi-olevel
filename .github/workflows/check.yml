name: Check lesson
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install LaTeX for TikZ figures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-pictures texlive-fonts-recommended poppler-utils
      - run: npm ci
      - run: npm run build:pdf
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: site
          retention-days: 14
